[module]
name = "courseware.adapters"
version = "0.5.0"
description = "Adapt course packages into ordered chapters, navigation and exercise checks."

[requires]
"qn.build.cargo" = "^0.3"

[build.courseware-adapters]
provider = "qn.build.cargo"
schema = 2
toolchain = "rust"
inputs = ["src/**/*", "data/permissions.toml"]

[build.courseware-adapters.manifest]
lib = { path = "src/lib.rs" }
package = { name = "courseware-adapters", version = "0.5.0", edition = "2024" }

[build.courseware-adapters.manifest.dependencies]
anyhow = { version = "1" }
regex = { version = "1" }
serde = { version = "1", features = ["derive"] }
sha2 = { version = "0.10" }
tar = { version = "0.4" }
toml = { version = "0.9" }
